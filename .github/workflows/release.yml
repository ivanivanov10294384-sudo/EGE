name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          FILE="docs/releases/${TAG}.md"
          if [ ! -f "$FILE" ]; then
            echo "Описание docs/releases/${TAG}.md не найдено — беру шаблон"
            FILE="docs/releases/TEMPLATE.md"
          fi
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file "$FILE" \
            --verify-tag

      - name: Attach APK and refresh apk-latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK="APK mobile app/kabinet-repetitora.apk"
          if [ ! -f "$APK" ]; then
            echo "APK не найден ($APK) — пропускаю: кнопка скачивания уйдёт на /apk без файла"
            exit 0
          fi
          # файл прикрепляется к самому релизу — его можно скачать со страницы релиза
          # ($TAG из предыдущего шага здесь не видна — берём стандартную GITHUB_REF_NAME)
          gh release upload "$GITHUB_REF_NAME" "$APK" --clobber
          # роллинг-релиз «apk-latest»: адрес из мини-аппа не меняется, CI перезаливает туда файл
          if gh release view apk-latest >/dev/null 2>&1; then
            gh release upload apk-latest "$APK" --clobber
          else
            gh release create apk-latest "$APK" \
              --title "Последняя сборка APK" \
              --notes "Роллинг-релиз: CI при каждой сборке перезаливает сюда актуальный kabinet-repetitora.apk. Мини-апп скачивает приложение именно по этой ссылке."
          fi
