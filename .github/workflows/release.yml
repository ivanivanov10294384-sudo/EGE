name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          FILE="docs/releases/${TAG}.md"
          if [ ! -f "$FILE" ]; then
            echo "Описание docs/releases/${TAG}.md не найдено — беру шаблон"
            FILE="docs/releases/TEMPLATE.md"
          fi
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file "$FILE" \
            --verify-tag
